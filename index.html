<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG International - Quality & Claims Portal</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #475569;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 28px -6px rgba(37, 99, 235, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--primary); padding-bottom: 60px; -webkit-font-smoothing: antialiased; }

        /* Top Navigation */
        nav { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 28px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--primary); }
        .brand-logo-img { height: 42px; width: auto; object-fit: contain; }
        .brand-text { display: flex; flex-direction: column; }
        .brand-title { font-weight: 800; font-size: 1.15rem; color: var(--primary); line-height: 1.2; letter-spacing: -0.01em; }
        .brand-sub { font-size: 0.8rem; color: var(--secondary); font-weight: 600; }
        
        .nav-status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #166534; background-color: #f0fdf4; border: 1px solid #bbf7d0; padding: 6px 14px; border-radius: 20px; font-weight: 600; }
        .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }

        /* Hero & Search Header */
        .hero { max-width: 1200px; margin: 40px auto 24px auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
        .hero-text h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; color: var(--primary); }
        .hero-text p { color: var(--secondary); font-size: 0.95rem; margin-top: 6px; }

        .search-box { position: relative; min-width: 300px; }
        .search-box input { width: 100%; padding: 11px 16px 11px 40px; border-radius: 10px; border: 1px solid var(--border); outline: none; font-size: 0.9rem; background-color: var(--card-bg); transition: all 0.25s ease; box-shadow: var(--shadow-sm); }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--secondary); font-size: 0.95rem; }

        /* Layout Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .section-header { display: flex; align-items: center; gap: 14px; margin: 36px 0 18px 0; }
        .section-title { font-size: 0.8rem; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.1em; background: #f1f5f9; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }
        .section-line { flex: 1; height: 1px; background-color: var(--border); }

        /* Grid Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-sm); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); opacity: 0; transition: opacity 0.3s ease; }
        .card:hover { border-color: #cbd5e1; transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .card:hover::before { opacity: 1; }

        .card-top { margin-bottom: 14px; }
        .card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .platform-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; background-color: #f8fafc; border: 1px solid var(--border); }
        
        .badge { font-size: 0.725rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.02em; }
        .badge-html { background-color: #fef3c7; color: #92400e; }
        .badge-looker { background-color: #e0f2fe; color: #075985; }
        .badge-webapp { background-color: #f3e8ff; color: #6b21a8; }
        .badge-notion { background-color: #f1f5f9; color: #334155; }
        .badge-sheet { background-color: #dcfce7; color: #166534; }
        .badge-hectre { background-color: #ffedd5; color: #c2410c; }

        .card-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); line-height: 1.35; margin-bottom: 8px; }
        .card-desc { font-size: 0.85rem; color: var(--secondary); line-height: 1.5; }
        
        .card-footer { font-size: 0.825rem; color: var(--accent); font-weight: 600; display: flex;
